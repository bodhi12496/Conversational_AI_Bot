[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coe-conversational-data-platform"
version = "0.1.0"
description = "Versioned semantic modeling and governed conversational analytics"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1", "pydantic==2.13.4", "uvicorn==0.52.1",
  "python-multipart==0.0.32", "openpyxl==3.1.5",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.40,<2"]
dev = ["pytest>=8,<10", "httpx==0.28.1", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
app = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check backend scripts
      - run: python -m ruff format --check backend scripts
      - run: python -m pytest -q
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
      - run: python scripts/verify_local.py --dom
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          COE_DATA_DIR=/tmp/coe-ci uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > /tmp/coe-server.log 2>&1 &
          python scripts/smoke_ui.py
